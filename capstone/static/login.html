<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="box login"><h1>Remote Login</h1>
<form method="POST" action="/login">
<label for="username">Username</label><input id="username" name="username" placeholder="Username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
<button class="door" type="submit">Login</button></form><p><a href="/">Back to monitor</a></p></div>
</body></html>
